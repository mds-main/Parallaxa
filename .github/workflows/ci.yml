name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (includes the no-hard-coded-locales rule)
        run: pnpm lint
      - name: i18n catalogs (every registry language, es-ES lexicon)
        run: pnpm i18n:check
      - name: Database migrations (schema drift, safety rules for the live version)
        run: pnpm db:check
      - name: Unit and integration tests (demo mode, in-memory database)
        run: pnpm test
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and check that no server secrets reach browser bundles
        run: pnpm build && pnpm check:secrets
      - name: End-to-end and accessibility tests (mobile + desktop)
        run: pnpm e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  eval-gate:
    # Release gate (TODO 23.6): runs only when a Venice key is available to this repository.
    runs-on: ubuntu-latest
    needs: checks
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did prompts, models or the pipeline change?
        id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(prompts/|src/lib/ai/|src/lib/pipeline/|evals/)'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v6
        if: steps.changed.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Gold-set eval
        if: steps.changed.outputs.run == 'true'
        run: pnpm eval
        env:
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          PARALLAXA_DB: memory
